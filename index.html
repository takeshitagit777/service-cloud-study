<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Salesforce Service Cloud Consultant 過去問 196問 日本語学習サイト" />
  <meta name="theme-color" content="#0b1220" />
  <title>Service Cloud Consultant Cert Lab - 196問</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="brand" type="button" data-nav="home" aria-label="ホームへ戻る">
          <span class="brand-mark">SC</span>
          <span><strong>Service Cloud</strong><small>Consultant Cert Lab</small></span>
        </button>
        <span class="count-badge">196問・日本語版</span>
        <div class="top-spacer"></div>
        <div id="topTimer" class="top-timer" aria-live="polite"></div>
      </div>
    </header>

    <div class="page-layout">
      <aside class="sidebar" aria-label="メインメニュー">
        <button class="nav-item active" data-nav="home">🏠 <span>ホーム</span></button>
        <button class="nav-item" data-nav="practice">📚 <span>一問一答</span></button>
        <button class="nav-item" data-nav="mock">📝 <span>模擬試験</span></button>
        <button class="nav-item" data-nav="review">❌ <span>間違い復習</span></button>
        <button class="nav-item" data-nav="analysis">📊 <span>学習分析</span></button>
        <button class="nav-item" data-nav="bank">🧰 <span>問題バンク</span></button>
      </aside>

      <main class="main-content">
        <section id="home" class="view active"></section>
        <section id="practice" class="view"></section>
        <section id="mock" class="view"></section>
        <section id="review" class="view"></section>
        <section id="analysis" class="view"></section>
        <section id="bank" class="view"></section>
      </main>
    </div>
  </div>

  <script src="./data/questions.js"></script>
  <script src="./app.js"></script>
</body>
</html>
